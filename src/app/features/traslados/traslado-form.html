<h2>Nuevo traslado</h2>

@if (error()) {
  <nz-alert nzType="error" [nzMessage]="error()" nzShowIcon class="alerta"></nz-alert>
}

<form nz-form nzLayout="vertical" [formGroup]="formulario" (ngSubmit)="enviar()">
  <div class="fila">
    <nz-form-item class="campo">
      <nz-form-label nzRequired>Almacén origen</nz-form-label>
      <nz-form-control>
        <nz-select formControlName="almacenOrigenId" nzPlaceHolder="Selecciona">
          @for (a of almacenes(); track a.id) {
            <nz-option [nzValue]="a.id" [nzLabel]="a.nombre"></nz-option>
          }
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo">
      <nz-form-label nzRequired>Almacén destino</nz-form-label>
      <nz-form-control>
        <nz-select formControlName="almacenDestinoId" nzPlaceHolder="Selecciona">
          @for (a of almacenes(); track a.id) {
            <nz-option [nzValue]="a.id" [nzLabel]="a.nombre"></nz-option>
          }
        </nz-select>
      </nz-form-control>
    </nz-form-item>
  </div>

  <nz-form-item>
    <nz-form-label>Observaciones</nz-form-label>
    <nz-form-control>
      <textarea nz-input formControlName="observaciones" rows="2"></textarea>
    </nz-form-control>
  </nz-form-item>

  <h3>Líneas</h3>
  <div formArrayName="detalles">
    @for (fila of detalles.controls; track $index) {
      <div class="linea" [formGroupName]="$index">
        <nz-form-item class="campo campo-producto">
          <nz-form-label>Producto</nz-form-label>
          <nz-form-control>
            <nz-select formControlName="productoId" nzPlaceHolder="Selecciona un producto" nzShowSearch>
              @for (p of productos(); track p.id) {
                <nz-option [nzValue]="p.id" [nzLabel]="p.codigo + ' -- ' + p.nombre"></nz-option>
              }
            </nz-select>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item class="campo">
          <nz-form-label>Cantidad</nz-form-label>
          <nz-form-control>
            <nz-input-number formControlName="cantidad" [nzMin]="1" style="width: 100%"></nz-input-number>
          </nz-form-control>
        </nz-form-item>

        <button nz-button nzType="text" nzDanger type="button" (click)="quitarFila($index)" [disabled]="detalles.length <= 1">
          <span nz-icon nzType="delete"></span>
        </button>
      </div>
    }
  </div>
  <button nz-button type="button" (click)="agregarFila()" class="boton-agregar">
    <span nz-icon nzType="plus"></span>
    Agregar línea
  </button>

  <div class="acciones">
    <button nz-button routerLink="/traslados" type="button">Cancelar</button>
    <button nz-button nzType="primary" [nzLoading]="guardando()" type="submit">Guardar</button>
  </div>
</form>
