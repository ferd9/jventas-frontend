<h2>{{ clienteId() ? 'Editar cliente' : 'Nuevo cliente' }}</h2>

@if (error()) {
  <nz-alert nzType="error" [nzMessage]="error()" nzShowIcon class="alerta"></nz-alert>
}

<form nz-form nzLayout="vertical" [formGroup]="formulario" (ngSubmit)="enviar()">
  <div class="fila">
    <nz-form-item class="campo">
      <nz-form-label nzRequired>Tipo</nz-form-label>
      <nz-form-control>
        <nz-select formControlName="tipo">
          @for (t of tiposCliente; track t.valor) {
            <nz-option [nzValue]="t.valor" [nzLabel]="t.etiqueta"></nz-option>
          }
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo">
      <nz-form-label>RUC</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="ruc" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo">
      <nz-form-label>DNI</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="dni" />
      </nz-form-control>
    </nz-form-item>
  </div>

  <div class="fila">
    <nz-form-item class="campo">
      <nz-form-label nzRequired>Nombre</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="nombre" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo">
      <nz-form-label nzRequired>Apellidos</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="apellidos" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo">
      <nz-form-label>Sexo</nz-form-label>
      <nz-form-control>
        <nz-select formControlName="sexo" nzPlaceHolder="Opcional" nzAllowClear>
          @for (s of sexos; track s.valor) {
            <nz-option [nzValue]="s.valor" [nzLabel]="s.etiqueta"></nz-option>
          }
        </nz-select>
      </nz-form-control>
    </nz-form-item>
  </div>

  <div class="fila">
    <nz-form-item class="campo">
      <nz-form-label>Email</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="email" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo">
      <nz-form-label>Teléfono</nz-form-label>
      <nz-form-control nzErrorTip="Máximo 15 caracteres">
        <input nz-input formControlName="telefono" maxlength="15" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo">
      <nz-form-label>Celular</nz-form-label>
      <nz-form-control nzErrorTip="Máximo 15 caracteres">
        <input nz-input formControlName="celular" maxlength="15" />
      </nz-form-control>
    </nz-form-item>
  </div>

  <h3>Dirección</h3>
  <nz-form-item>
    <nz-form-label>Dirección</nz-form-label>
    <nz-form-control>
      <input nz-input formControlName="direccionLinea" placeholder="Av. / calle, número" />
    </nz-form-control>
  </nz-form-item>

  <div class="fila">
    <nz-form-item class="campo">
      <nz-form-label>País</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="pais" placeholder="Perú" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo">
      <nz-form-label>Departamento</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="departamento" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo">
      <nz-form-label>Provincia</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="provincia" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo">
      <nz-form-label>Distrito</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="distrito" />
      </nz-form-control>
    </nz-form-item>
  </div>

  <nz-form-item>
    <nz-form-label>Referencia</nz-form-label>
    <nz-form-control>
      <input nz-input formControlName="referencia" />
    </nz-form-control>
  </nz-form-item>

  <div class="acciones">
    <button nz-button routerLink="/clientes" type="button">Cancelar</button>
    <button nz-button nzType="primary" [nzLoading]="guardando()" type="submit">Guardar</button>
  </div>
</form>
