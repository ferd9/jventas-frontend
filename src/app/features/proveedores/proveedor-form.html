<h2>{{ proveedorId() ? 'Editar proveedor' : 'Nuevo proveedor' }}</h2>

@if (error()) {
  <nz-alert nzType="error" [nzMessage]="error()" nzShowIcon class="alerta"></nz-alert>
}

<form nz-form nzLayout="vertical" [formGroup]="formulario" (ngSubmit)="enviar()">
  <div class="fila">
    <nz-form-item class="campo">
      <nz-form-label nzRequired>RUC</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="ruc" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo campo-ancho">
      <nz-form-label nzRequired>Razón social</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="razonSocial" />
      </nz-form-control>
    </nz-form-item>
  </div>

  <div class="fila">
    <nz-form-item class="campo">
      <nz-form-label>Nombre de contacto</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="nombreContacto" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo">
      <nz-form-label>Email</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="email" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo">
      <nz-form-label>Rubro</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="rubro" />
      </nz-form-control>
    </nz-form-item>
  </div>

  <div class="fila">
    <nz-form-item class="campo">
      <nz-form-label>Teléfono</nz-form-label>
      <nz-form-control nzErrorTip="Máximo 15 caracteres">
        <input nz-input formControlName="telefono" maxlength="15" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo">
      <nz-form-label>Teléfono alternativo</nz-form-label>
      <nz-form-control nzErrorTip="Máximo 15 caracteres">
        <input nz-input formControlName="telefonoAlternativo" maxlength="15" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo">
      <nz-form-label>Cuenta bancaria</nz-form-label>
      <nz-form-control nzErrorTip="Máximo 30 caracteres">
        <input nz-input formControlName="cuentaBancaria" maxlength="30" />
      </nz-form-control>
    </nz-form-item>
  </div>

  <h3>Dirección</h3>
  <nz-form-item>
    <nz-form-label nzRequired>Dirección</nz-form-label>
    <nz-form-control>
      <input nz-input formControlName="direccionLinea" placeholder="Av. / calle, número" />
    </nz-form-control>
  </nz-form-item>

  <div class="fila">
    <nz-form-item class="campo">
      <nz-form-label>País</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="pais" placeholder="Perú" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo">
      <nz-form-label>Departamento</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="departamento" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo">
      <nz-form-label>Provincia</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="provincia" />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="campo">
      <nz-form-label>Distrito</nz-form-label>
      <nz-form-control>
        <input nz-input formControlName="distrito" />
      </nz-form-control>
    </nz-form-item>
  </div>

  <nz-form-item>
    <nz-form-label>Referencia</nz-form-label>
    <nz-form-control>
      <input nz-input formControlName="referencia" />
    </nz-form-control>
  </nz-form-item>

  <div class="acciones">
    <button nz-button routerLink="/proveedores" type="button">Cancelar</button>
    <button nz-button nzType="primary" [nzLoading]="guardando()" type="submit">Guardar</button>
  </div>
</form>
