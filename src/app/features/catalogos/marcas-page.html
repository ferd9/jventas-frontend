<div class="encabezado">
  <h2>Marcas</h2>
  <button nz-button nzType="primary" (click)="abrirCrear()">
    <span nz-icon nzType="plus"></span>
    Nueva marca
  </button>
</div>

<nz-table [nzData]="marcas()" [nzLoading]="cargando()" [nzShowPagination]="false">
  <thead>
    <tr>
      <th>Nombre</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (marca of marcas(); track marca.id) {
      <tr>
        <td>{{ marca.nombre }}</td>
        <td><a (click)="abrirEditar(marca)">Editar</a></td>
      </tr>
    }
  </tbody>
</nz-table>

<nz-modal
  [nzVisible]="modalVisible()"
  [nzTitle]="editandoId() ? 'Editar marca' : 'Nueva marca'"
  (nzOnCancel)="cancelar()"
  (nzOnOk)="guardar()"
  [nzOkLoading]="guardando()"
>
  <ng-container *nzModalContent>
    @if (error()) {
      <nz-alert nzType="error" [nzMessage]="error()" nzShowIcon class="alerta"></nz-alert>
    }
    <form nz-form nzLayout="vertical" [formGroup]="formulario">
      <nz-form-item>
        <nz-form-label nzRequired>Nombre</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="nombre" />
        </nz-form-control>
      </nz-form-item>
    </form>
  </ng-container>
</nz-modal>
